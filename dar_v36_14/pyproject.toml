[build-system]
requires = ["setuptools>=40.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dar-security"
version = "36.14.0"
description = "Decision Accountability Review security core"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8", "psycopg[binary]>=3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dar*"]
exclude = ["spec*", "tests*"]
