<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Decision Authority Research</title>
<meta name="description" content="Private advisory for boards, executives, founders and counsel facing irreversible decisions under uncertainty.">
<meta name="theme-color" content="#090909">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://matrix-audit.com/">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{scroll-behavior:smooth;}

:root{
--bg:#090909;
--bg2:#111111;
--panel:#0d0d0d;
--gold:#b89a67;
--gold2:#d8bb8c;
--text:#efe9df;
--soft:#cfc3b4;
--muted:#8a8176;
--line:rgba(255,255,255,.06);
--line2:rgba(184,154,103,.20);
}

body{
background:var(--bg);
color:var(--text);
font-family:'Cormorant Garamond',serif;
line-height:1.7;
overflow-x:hidden;
-webkit-font-smoothing:antialiased;
}

body:before{
content:'';
position:fixed;
inset:0;
pointer-events:none;
opacity:.25;
background:
radial-gradient(circle at 85% 15%, rgba(184,154,103,.07), transparent 30%),
radial-gradient(circle at 15% 80%, rgba(184,154,103,.05), transparent 25%);
z-index:0;
}

a{
color:inherit;
text-decoration:none;
}

img{max-width:100%;display:block;}

.topbar{
position:fixed;
top:0;
left:0;
right:0;
z-index:1000;
height:78px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
background:rgba(9,9,9,.88);
backdrop-filter:blur(16px);
border-bottom:1px solid var(--line);
}

.brand{
display:flex;
align-items:center;
gap:14px;
font-family:'IBM Plex Mono',monospace;
font-size:10px;
letter-spacing:.32em;
text-transform:uppercase;
color:var(--soft);
}

.brand-line{
width:26px;
height:1px;
background:var(--gold);
}

.menu-btn{
width:42px;
height:42px;
border:none;
background:none;
cursor:pointer;
display:flex;
flex-direction:column;
justify-content:center;
gap:6px;
}

.menu-btn span{
display:block;
height:1px;
background:var(--muted);
transition:.3s;
}

.menu-btn span:nth-child(1){width:24px;}
.menu-btn span:nth-child(2){width:18px;margin-left:6px;}
.menu-btn span:nth-child(3){width:24px;}

.menu-btn:hover span,
.menu-btn:active span{
background:var(--gold2);
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
backdrop-filter:blur(4px);
opacity:0;
visibility:hidden;
transition:.35s;
z-index:998;
}

.overlay.active{
opacity:1;
visibility:visible;
}

.side-menu{
position:fixed;
top:0;
right:-50%;
width:50%;
max-width:420px;
min-width:280px;
height:100vh;
background:#0b0b0b;
z-index:999;
padding:28px;
border-left:1px solid var(--line2);
transition:.35s ease;
display:flex;
flex-direction:column;
}

.side-menu.active{
right:0;
}

.menu-top{
display:flex;
justify-content:space-between;
align-items:center;
padding-bottom:24px;
border-bottom:1px solid var(--line);
margin-bottom:24px;
}

.menu-title{
font-family:'IBM Plex Mono',monospace;
font-size:9px;
letter-spacing:.28em;
text-transform:uppercase;
color:var(--gold);
}

.close-btn{
border:none;
background:none;
color:var(--muted);
font-family:'IBM Plex Mono',monospace;
font-size:11px;
cursor:pointer;
}

.close-btn:hover,
.close-btn:active{
color:var(--gold2);
}

.nav{
display:flex;
flex-direction:column;
gap:4px;
}

.nav a{
padding:14px 0;
border-bottom:1px solid rgba(255,255,255,.03);
font-size:28px;
font-weight:300;
transition:.25s;
}

.nav a:hover,
.nav a:active{
color:var(--gold2);
padding-left:8px;
}

.menu-bottom{
margin-top:auto;
padding-top:28px;
border-top:1px solid var(--line);
}

.menu-cta{
display:block;
padding:16px;
text-align:center;
border:1px solid var(--line2);
font-family:'IBM Plex Mono',monospace;
font-size:10px;
letter-spacing:.24em;
text-transform:uppercase;
color:var(--gold2);
margin-bottom:14px;
transition:.25s;
}

.menu-cta:hover,
.menu-cta:active{
background:rgba(184,154,103,.08);
border-color:var(--gold);
}

.menu-mail{
display:block;
padding:14px;
text-align:center;
font-family:'IBM Plex Mono',monospace;
font-size:12px;
letter-spacing:.04em;
color:var(--soft);
border:1px solid var(--line);
transition:.25s;
word-break:break-word;
}

.menu-mail:hover,
.menu-mail:active{
color:var(--gold2);
border-color:var(--line2);
}

.hero{
position:relative;
z-index:1;
min-height:100vh;
display:flex;
align-items:center;
padding:140px 28px 80px;
}

.hero-inner{
max-width:900px;
}

.eyebrow{
font-family:'IBM Plex Mono',monospace;
font-size:10px;
letter-spacing:.34em;
text-transform:uppercase;
color:var(--gold);
margin-bottom:28px;
}

.hero h1{
font-size:clamp(52px,10vw,102px);
font-weight:300;
line-height:0.98;
letter-spacing:-.02em;
margin-bottom:26px;
}

.hero h1 em{
font-style:italic;
color:var(--gold2);
}

.hero p{
max-width:560px;
font-size:clamp(18px,2vw,22px);
color:var(--muted);
margin-bottom:36px;
}

.hero-link{
font-family:'IBM Plex Mono',monospace;
font-size:10px;
letter-spacing:.28em;
text-transform:uppercase;
color:var(--gold);
display:inline-flex;
gap:10px;
align-items:center;
border-bottom:1px solid var(--line2);
padding-bottom:4px;
transition:.25s;
}

.hero-link:hover,
.hero-link:active{
color:var(--gold2);
border-color:var(--gold);
}

.section{
position:relative;
z-index:1;
padding:0 28px 100px;
max-width:1180px;
margin:auto;
}

.label{
font-family:'IBM Plex Mono',monospace;
font-size:9px;
letter-spacing:.34em;
text-transform:uppercase;
color:var(--gold);
margin-bottom:26px;
}

.statement{
font-size:clamp(34px,5vw,62px);
font-weight:300;
line-height:1.08;
max-width:900px;
margin-bottom:24px;
}

.statement em{color:var(--gold2);font-style:italic;}

.copy{
max-width:700px;
font-size:20px;
color:var(--muted);
margin-bottom:42px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:1px;
background:var(--line);
}

.card{
background:var(--panel);
padding:34px;
transition:.25s;
}

.card:hover,
.card:active{
background:#141414;
}

.card-tag{
font-family:'IBM Plex Mono',monospace;
font-size:9px;
letter-spacing:.26em;
text-transform:uppercase;
color:var(--gold);
margin-bottom:14px;
}

.card h3{
font-size:34px;
font-weight:300;
margin-bottom:12px;
}

.card p{
font-size:18px;
color:var(--muted);
}

.cta-block{
margin-top:70px;
padding:56px 34px;
border:1px solid var(--line2);
background:linear-gradient(180deg,#0e0e0e,#0a0a0a);
}

.cta-block h2{
font-size:clamp(36px,5vw,64px);
font-weight:300;
line-height:1.04;
margin-bottom:18px;
}

.cta-block p{
max-width:620px;
font-size:20px;
color:var(--muted);
margin-bottom:28px;
}

.cta-link{
font-family:'IBM Plex Mono',monospace;
font-size:10px;
letter-spacing:.28em;
text-transform:uppercase;
color:var(--gold2);
border-bottom:1px solid var(--line2);
padding-bottom:4px;
}

.site-footer{
border-top:1px solid var(--line);
padding:32px 28px;
text-align:center;
}

.footer-copy{
font-family:'IBM Plex Mono',monospace;
font-size:11px;
line-height:1.8;
letter-spacing:.08em;
color:var(--muted);
max-width:900px;
margin:auto;
}

.footer-copy span{
color:var(--soft);
}

@media(max-width:900px){

.side-menu{
width:50%;
min-width:260px;
}

.grid{
grid
