databases:
  - name: dar-authority-db
    plan: free
    region: frankfurt
    databaseName: dar_authority_db
    user: dar_authority_db_user
    postgresMajorVersion: 18

services:
  - type: web
    name: dar-external-authority-v2
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python dar_v36_14/external_authority_server.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DAR_PERSISTENCE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: dar-authority-db
          property: connectionString
