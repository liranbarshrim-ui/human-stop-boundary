name: DAR Live OS Boundary

on:
  workflow_dispatch:
  push:
    paths:
      - 'dar_v36_14/dar/boundary.py'
      - 'dar_v36_14/dar/process_dispatcher.py'
      - 'dar_v36_14/dar/effect_gate.py'
      - 'dar_v36_14/dar/kernel.py'
      - 'dar_v36_14/dar/store.py'
      - 'dar_v36_14/dar/hardening.py'
      - 'dar_v36_14/live_os_boundary_test.py'
      - 'dar_v36_14/run_privileged_server.py'
      - '.github/workflows/live-boundary.yml'

jobs:
  live-os-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test package
        working-directory: dar_v36_14
        run: python -m pip install '.[test]'
      - name: Stage privileged runtime
        working-directory: dar_v36_14
        run: |
          install -m 0755 run_privileged_server.py /tmp/dar-run-privileged-server.py
          rm -rf /tmp/dar
          cp -a dar /tmp/dar
          chmod -R a+rX /tmp/dar
      - name: Run live two-UID boundary test
        working-directory: dar_v36_14
        run: sudo -E env PYTHONPATH=/tmp DAR_PRIVILEGED_LAUNCHER=/tmp/dar-run-privileged-server.py python live_os_boundary_test.py
