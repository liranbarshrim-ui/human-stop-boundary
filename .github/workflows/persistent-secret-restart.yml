name: Persistent Secret Restart Qualification

on:
  push:
    branches:
      - reference/staging-deployment-integration
  workflow_dispatch:

jobs:
  persistent-secret-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run persistent secret restart qualification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          cd reference_integration
          PYTHONUNBUFFERED=1 python persistent_secret_restart.py | tee persistent-secret-restart.log
      - name: Hash evidence
        if: always()
        run: sha256sum reference_integration/persistent-secret-restart.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-secret-restart-qualification
          path: reference_integration/persistent-secret-restart.log
          if-no-files-found: error
# trigger persistent-secret qualification on the current branch head
