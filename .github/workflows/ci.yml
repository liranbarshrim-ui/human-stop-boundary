name: DAR CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: dar_v36_14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Run portable test suite
        run: pytest -q --ignore=live_os_boundary_test.py
      - name: Note privileged live smoke test
        run: echo "live_os_boundary_test.py is an optional privileged two-UID smoke test and is not run on the unprivileged GitHub-hosted runner"
