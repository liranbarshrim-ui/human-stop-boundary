name: DAR Boundary Conformance

on:
  push:
    branches:
      - dar-nf-10k
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  actions: read

concurrency:
  group: dar-official-10k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dar_v36_14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Run conformance tests
        run: python tools/run_conformance.py

  external-10k:
    name: External Authority 10K Load
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runner and authority dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare runner state directory
        run: mkdir -p .state
      - name: Start external PostgreSQL-backed DAR authority
        env:
          DAR_PERSISTENCE_MODE: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          DAR_DB_SSLMODE: disable
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python dar_v36_14/external_authority_server.py > authority.log 2>&1 &
          echo $! > authority.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health; then
              echo
              echo "External authority is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "External authority failed health check"
          cat authority.log
          exit 1
      - name: Run full 10K external load
        env:
          DAR_AUTHORITY_URL: http://127.0.0.1:10000
          DAR_CHECKPOINT_PATH: ${{ github.workspace }}/.state/checkpoint.json
          DAR_LOAD_ROUNDS: "10000"
          DAR_LOAD_WORKERS: "32"
          DAR_LOAD_TIMEOUT: "60"
          DAR_HEALTH_RETRIES: "6"
          DAR_REQUEST_RETRIES: "4"
          DAR_ROUND_RETRIES: "8"
          DAR_PROGRESS_INTERVAL: "100"
          DAR_PROGRESS_HEARTBEAT_SECONDS: "60"
          DAR_HEARTBEAT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PYTHONPATH: ${{ github.workspace }}/dar_v36_14:${{ github.workspace }}
        run: |
          python tools/resumable_10k_runner.py 2>&1 | tee runner.log
      - name: Build machine-readable evidence package
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("evidence-10k")
          root.mkdir(exist_ok=True)
          run_log = Path("runner.log")
          authority_log = Path("authority.log")
          text = run_log.read_text(encoding="utf-8", errors="replace") if run_log.exists() else ""
          records = []
          for line in text.splitlines():
              line = line.strip()
              if line.startswith("{") and line.endswith("}"):
                  try:
                      obj = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if obj.get("evidence_type", "").startswith("external-authority-concurrent-load"):
                      records.append(obj)
          finals = [r for r in records if r.get("evidence_type") == "external-authority-concurrent-load-black-box"]
          final = finals[-1] if finals else (records[-1] if records else {"verdict": "INCONCLUSIVE", "evidence_type": "missing-final-evidence"})
          manifest = {
              "schema": 1,
              "workflow": "DAR Boundary Conformance",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "final_evidence": final,
              "runner_log_sha256": hashlib.sha256(run_log.read_bytes()).hexdigest() if run_log.exists() else None,
              "authority_log_sha256": hashlib.sha256(authority_log.read_bytes()).hexdigest() if authority_log.exists() else None,
          }
          (root / "evidence.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "runner.log").write_text(text, encoding="utf-8")
          if authority_log.exists():
              (root / "authority.log").write_bytes(authority_log.read_bytes())
          print(json.dumps(manifest, indent=2, sort_keys=True))
      - name: Upload 10K evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dar-10k-evidence-${{ github.run_id }}
          path: evidence-10k/
          if-no-files-found: error
      - name: Preserve authority log
        if: always()
        run: cat authority.log || true
