name: Matrix Audit site upgrade

on:
  push:
    paths:
      - 'scripts/site_upgrade.py'
      - 'site-upgrade.css'
      - '.github/workflows/site-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply site-wide upgrade
        run: python scripts/site_upgrade.py

      - name: Commit generated page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes required"
            exit 0
          fi
          git commit -m "site: upgrade Matrix Audit pages"
          git push
