name: Reference Staging Qualification

on:
  push:
    branches:
      - reference/staging-deployment-integration
  workflow_dispatch:

jobs:
  runtime-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        timeout-minutes: 1
        run: python -m pip install --upgrade pip pytest
      - name: Normalize integration scripts into runtime directory
        timeout-minutes: 1
        run: |
          mkdir -p /tmp/dar-reference/dar_v36_14
          cp reference_integration/*.py /tmp/dar-reference/
          cp -R dar_v36_14/dar /tmp/dar-reference/dar_v36_14/
          chmod 755 /tmp/dar-reference/*.py
      - name: Run two-UID adversarial qualification
        timeout-minutes: 2
        env:
          QUALIFICATION_COMMIT: ${{ github.sha }}
        run: |
          set +e
          cd /tmp/dar-reference
          timeout --signal=TERM --kill-after=10s 90s python two_uid_qualification.py | tee qualification-two-uid.log
          status=${PIPESTATUS[0]}
          cp two_uid_evidence.json "$GITHUB_WORKSPACE/reference_integration/two_uid_evidence.json" 2>/dev/null || true
          cp qualification-two-uid.log "$GITHUB_WORKSPACE/reference_integration/qualification-two-uid.log" 2>/dev/null || true
          exit "$status"
      - name: Hash qualification evidence
        if: always()
        timeout-minutes: 1
        run: |
          test -f reference_integration/two_uid_evidence.json
          test -f reference_integration/qualification-two-uid.log
          sha256sum reference_integration/two_uid_evidence.json
          sha256sum reference_integration/qualification-two-uid.log
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-staging-two-uid-qualification
          path: |
            reference_integration/two_uid_evidence.json
            reference_integration/qualification-two-uid.log
          if-no-files-found: error
