name: Reference Staging Qualification

on:
  push:
    branches:
      - reference/staging-deployment-integration
  workflow_dispatch:

jobs:
  runtime-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Normalize integration scripts into runtime directory
        run: |
          mkdir -p /tmp/dar-reference
          cp reference_integration/*.py /tmp/dar-reference/
          chmod 755 /tmp/dar-reference/*.py
      - name: Run two-UID adversarial qualification
        timeout-minutes: 2
        env:
          QUALIFICATION_COMMIT: ${{ github.sha }}
        run: |
          cd /tmp/dar-reference
          timeout --signal=TERM --kill-after=10s 90s python two_uid_qualification.py | tee /tmp/dar-reference/qualification-two-uid.log
          cp /tmp/dar-reference/two_uid_evidence.json "$GITHUB_WORKSPACE/reference_integration/two_uid_evidence.json"
          cp /tmp/dar-reference/qualification-two-uid.log "$GITHUB_WORKSPACE/reference_integration/qualification-two-uid.log"
      - name: Hash qualification evidence
        timeout-minutes: 1
        run: |
          sha256sum reference_integration/two_uid_evidence.json
          sha256sum reference_integration/qualification-two-uid.log
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: reference-staging-two-uid-qualification
          path: |
            reference_integration/two_uid_evidence.json
            reference_integration/qualification-two-uid.log
