name: DAR External Concurrent Load Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - tests/test_external_load.py
      - .github/workflows/external-load-evidence.yml

jobs:
  external-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run black-box concurrent load
        env:
          DAR_AUTHORITY_URL: https://dar-external-authority-v2.onrender.com
          DAR_LOAD_ROUNDS: "500"
          DAR_LOAD_WORKERS: "64"
          DAR_LOAD_TIMEOUT: "15"
        run: python tests/test_external_load.py | tee external-load-evidence.jsonl
      - name: Verify machine-readable PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("external-load-evidence.jsonl").read_text().splitlines()[-1])
          assert record["verdict"] == "PASS", record
          assert record["rounds"] == 500, record
          assert record["workers"] == 64, record
          assert all(v == "PASS" for v in record["checks"].values()), record
          Path("external-load-evidence.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          print(json.dumps(record, sort_keys=True))
          PY
      - name: Upload load evidence
        uses: actions/upload-artifact@v4
        with:
          name: dar-external-concurrent-load-evidence
          path: external-load-evidence.json
