name: DAR External Concurrent Load Evidence

on:
  workflow_dispatch:

jobs:
  external-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run black-box concurrent load
        id: load
        env:
          DAR_AUTHORITY_URL: https://dar-external-authority-v2.onrender.com
          DAR_LOAD_ROUNDS: "250"
          DAR_LOAD_WORKERS: "16"
          DAR_LOAD_TIMEOUT: "30"
          DAR_HEALTH_RETRIES: "6"
        run: |
          set +e
          python tests/test_external_load.py | tee external-load-evidence.jsonl
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify machine-readable PASS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("external-load-evidence.jsonl").read_text().splitlines()[-1])
          print(json.dumps(record, sort_keys=True))
          Path("external-load-evidence.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          assert record["verdict"] == "PASS", record
          assert record["rounds"] == 250, record
          assert record["workers"] == 16, record
          assert all(v == "PASS" for v in record["checks"].values()), record
          PY
      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dar-external-concurrent-load-evidence
          path: external-load-evidence.json
